services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_metadata
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Khởi tạo database và tài khoản admin tự động
  airflow-init:
    build: .
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin
      "
    networks:
      - data-network

  # Giao diện Webserver điều khiển chính
  airflow-webserver:
    build: .
    container_name: airflow_webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # Giảm tải số workers xuống 2 để chống tràn RAM máy ảo EC2 yếu
      - AIRFLOW__WEBSERVER__WORKERS=2
      # Tăng thời gian timeout lên 300 giây để gunicorn master không bị sập sớm
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=300
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include 
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./jaffle_shop:/opt/airflow/jaffle_shop  # Mount thư mục dbt
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - data-network

  # Bộ lập lịch Scheduler để quét và chạy các DAG định kỳ
  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include 
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./jaffle_shop:/opt/airflow/jaffle_shop
    command: scheduler
    networks:
      - data-network

volumes:
  postgres_data:

networks:
  data-network:
    driver: bridge
