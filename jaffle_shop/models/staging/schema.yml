# file cấu hình định nghĩa tên bảng và các câu lệnh kiểm tra chất lượng dữ liệu (Data Tests như unique, not_null)
# để đảm bảo tầng Silver luôn sạch 

version: 2

sources:
  - name: raw_ebay_bronze
    description: "Dữ liệu thô từ tầng Bronze trên S3"
    database: EBAY_PROJECT_DB   
    schema: BRONZE              
    tables:
      - name: raw_ebay_listings # tên bảng dữ liệu thô trong schema bronze của snowflake 
        description: "Bảng chứa dữ liệu JSON/CSV thô cào từ eBay API"

models:
  - name: stg_ebay_raw
    description: "Tầng silver làm sạch dữ liệu thô ebay từ Bronze"
    columns:
      - name: item_id
        description: "Mã định danh duy nhất của sản phẩm"
        data_tests:
          - unique:
              config:
                severity: warn # Đổi sang cảnh báo
          - not_null 

      - name: legacy_item_id
        description: "Mã ID cũ"
        data_tests:
          - not_null

      - name: price_value
        description: "Giá bán hiện tại của sản phẩm"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              config:
                severity: warn # Bổ sung để bỏ qua dữ liệu bẩn
              arguments:
                expression: ">= 0" # dbt sẽ tự dịch thành (price_value >= 0)

      - name: current_bid_price_value
        description: "Giá thầu hiện tại (đối với sản phẩm đấu giá)"
        data_tests:
          - dbt_utils.expression_is_true: 
              config:
                severity: warn
              arguments:
                expression: ">= 0"

      - name: marketing_price_discount_percentage
        description: "Phần trăm giảm giá"
        data_tests:
          - dbt_utils.expression_is_true:
              config:
                severity: warn
              arguments:
                expression: "between 0 and 100" # dbt sẽ tự dịch thành (marketing_price_discount_percentage between 0 and 100)

      - name: seller_feedback_percentage
        description: "Tỷ lệ đánh giá tích cực của người bán"
        data_tests:
          - dbt_utils.expression_is_true:
              config:
                severity: warn
              arguments:
                expression: "between 0 and 100"

      - name: seller_feedback_score
        description: "Điểm số uy tín của người bán"
        data_tests:
          - dbt_utils.expression_is_true:
              config:
                severity: warn
              arguments:
                expression: ">= 0"

      - name: bid_count
        description: "Số lượt đặt thầu hiện tại"
        data_tests: 
          - dbt_utils.expression_is_true:
              config:
                severity: warn
              arguments:
                expression: ">= 0"

      - name: adult_only
        description: "Cờ đánh dấu sản phẩm giới hạn độ tuổi"
        data_tests: 
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['TRUE', 'FALSE']
                quote: true
