name: CI/CD Pipeline for dbt & SQL Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-dbt-tests:
    name: Run dbt Linter and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./jaffle_shop

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Check dbt syntax (dbt parse)
        run: |
          dbt deps    
          dbt parse --profiles-dir .