name: Full-Automated eBay dbt Pipeline

on:
  push:
    branches:
      - 'feature/**'    # Tự động chạy khi push lên bất kỳ nhánh feature nào
      - 'develop'       # Tự động chạy khi push/merge vào develop
      - 'main'          # Tự động chạy khi push/merge vào main
  pull_request:
    branches:
      - 'develop'
      - 'main'

jobs:
  dbt-ci-cd-workflow:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Run dbt build and test (Validation Gate)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          cd jaffle_shop
          dbt deps
          dbt build --select +dq_check ebay_data_cleaned ebay_data_json_expanded marts
          dbt test --select marts